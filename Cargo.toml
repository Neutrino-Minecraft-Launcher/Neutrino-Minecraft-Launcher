[package]
name = "neutrino_minecraft_launcher"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dotenvy = "0.15"
minecraft-msa-auth = { version = "0.5.0", features = ["is_sync", "ureq"] }
oauth2 = { version = "5.0.0", features = ["reqwest-blocking"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1"
slint = "1.18.1"
ureq = { version = "3", features = ["json"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
codegen-units = 1
lto = true
